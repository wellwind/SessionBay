[package]
name = "sessionbay"
version = "0.1.0"
description = "Local-first coding agent session workbench"
edition = "2021"
rust-version = "1.99"

[lib]
name = "sessionbay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "sessionbay"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = [], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
portable-pty = "0.9"
chrono = { version = "0.4", features = ["serde", "clock"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
walkdir = "2"
libc = "0.2"
dirs = "6"

tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
strip = true
