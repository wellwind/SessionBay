[package]
name = "sessionbay"
version = "0.1.0"
description = "Local-first coding agent session workbench"
edition = "2021"
default-run = "sessionbay"
rust-version = "1.99"

[lib]
name = "sessionbay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "sessionbay"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "sessionbay-broker"
path = "src/bin/sessionbay-broker.rs"

[features]
search-profile = []
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog", "dep:tauri-plugin-notification"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
base64 = "=0.22.1"
trash = { version = "=5.2.9", default-features = false, features = ["coinit_apartmentthreaded"] }
tauri-plugin-dialog = { version = "=2.8.3", optional = true }
tauri-plugin-notification = { version = "=2.5.1", optional = true }
tauri = { version = "2", features = [], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
portable-pty = "0.9"
chrono = { version = "0.4", features = ["serde", "clock"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
image-webp = "=0.2.4"
quick-xml = "=0.42.0"
walkdir = "2"
libc = "0.2"
dirs = "6"
# Hosting APIs (GitHub, self-hosted GitLab): rustls with the OS trust store
# so enterprise CAs work without disabling verification.
ureq = { version = "=3.5.0", default-features = false, features = ["rustls", "platform-verifier", "json"] }

tempfile = "3"
interprocess = { version = "2.4", features = ["tokio"] }
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "sync"] }
vt100 = "0.16"
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_IO", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_Security", "Win32_Security_Authorization"] }

[target.'cfg(windows)'.dependencies.widestring]
version = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSError", "NSFileManager", "NSString", "NSURL"] }

[profile.release]
codegen-units = 1
lto = true
strip = true

[dev-dependencies]
png = "=0.18.1"

[[example]]
name = "search_benchmark"
required-features = ["search-profile"]

[[example]]
name = "session_paging_benchmark"
required-features = ["search-profile"]
