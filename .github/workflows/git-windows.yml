name: Git workbench Windows acceptance
# Isolates Git evidence on Windows from unrelated pre-existing Windows test
# failures: Git Rust integration tests, a release build and the native
# WebView2 smoke with the synthetic-repository Git probe.
on:
  push:
    branches: ['feat/git-acceptance-docs']
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'scripts/ci-windows-smoke.ps1'
      - '.github/workflows/git-windows.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: git-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, Node 24
        with:
          node-version: '24'
          cache: npm
      - name: Rust components
        run: rustup show
      - run: git --version
      - run: npm ci
      - name: Git frontend tests
        run: npx vitest run src/git
      - name: Git Rust tests
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked --lib "git::"
          cargo test --manifest-path src-tauri/Cargo.toml --locked --test git_foundation --test git_staging --test git_remote --test git_history --test git_safety --test git_conflicts --test git_hosts --test git_pulls
      - name: Build unsigned local bundle
        run: npm run tauri -- build --bundles nsis
      - name: Native Windows Git smoke
        shell: pwsh
        run: ./scripts/ci-windows-smoke.ps1 -Git
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        if: always()
        with:
          name: git-windows-smoke
          path: artifacts/windows-smoke/
          retention-days: 7
          if-no-files-found: warn
