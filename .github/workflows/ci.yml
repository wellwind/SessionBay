name: Desktop acceptance (manual)
# Complete acceptance is intentionally manual; a skipped/unrun matrix is not a pass.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Acceptance scope (Windows-only is not three-OS acceptance)'
        type: choice
        required: true
        default: all
        options:
          - all
          - windows
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        # Missing inputs keep the full matrix; input never becomes a shell command or runner name.
        include: >-
          ${{ fromJSON(inputs.platform == 'windows' &&
            '[{"os":"windows-2022","bundle":"nsis"}]' ||
            '[{"os":"ubuntu-24.04","bundle":"deb"},{"os":"macos-15","bundle":"app"},{"os":"macos-15-intel","bundle":"app"},{"os":"windows-2022","bundle":"nsis"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, Node 24
        with:
          node-version: '24'
          cache: npm
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev patchelf xvfb xauth x11-utils imagemagick fonts-noto-cjk fontconfig
          fc-list :lang=zh-tw family | grep -F 'Noto Sans CJK TC'
          fc-match 'Noto Sans CJK TC:lang=zh-tw'
      - name: Rust components
        run: rustup show && rustup component add rustfmt clippy
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm test && npm run build
      - name: Validate visual assets and semantic contrast
        if: runner.os != 'Windows'
        run: python3 scripts/validate-ui-design.py && python3 scripts/validate-macos-icon.py
      - name: Validate visual assets and semantic contrast (Windows)
        if: runner.os == 'Windows'
        run: python scripts/validate-ui-design.py && python scripts/validate-macos-icon.py
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - name: Native Windows cleanup regression
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-smoke-cleanup.ps1
      - name: Build unsigned local bundle
        run: npm run tauri -- build --bundles ${{ matrix.bundle }}
      - name: Preserve macOS application permissions
        if: runner.os == 'macOS'
        run: |
          mkdir -p artifacts/macos
          tar -czf "artifacts/macos/SessionBay-${{ runner.arch }}.app.tar.gz" -C src-tauri/target/release/bundle/macos "Session Bay.app"
      - name: Native macOS startup smoke
        if: runner.os == 'macOS'
        run: bash scripts/ci-macos-smoke.sh
      - name: Native Linux window smoke
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1440x940x24" bash scripts/ci-linux-smoke.sh
      - name: Native Windows window smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci-windows-smoke.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        if: always()
        with:
          name: sessionbay-${{ matrix.os }}-unsigned
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            artifacts/macos/*.tar.gz
            artifacts/linux-smoke/
            artifacts/macos-smoke/
            src-tauri/target/release/bundle/nsis/*.exe
            artifacts/windows-smoke/
          retention-days: 7
          if-no-files-found: warn
