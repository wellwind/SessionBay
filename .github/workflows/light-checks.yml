name: Linux checks
# Push-only avoids a second pull_request run and uses the push diff for docs filtering.
# Checks remain attached to the commit visible in same-repository PRs.
on:
  push:
    branches: ['**']
    paths-ignore:
      - README.md
      - docs/*.md
permissions:
  contents: read
concurrency:
  group: linux-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    name: Linux lightweight
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, Node 24
        with:
          node-version: '24'
          cache: npm
      - name: Rust components
        run: rustup show && rustup component add rustfmt clippy
      - run: npm ci
      - name: Frontend checks
        run: npm run typecheck && npm run lint && npm test && npm run build
      - name: Verify sandbox-supported Chrome and install browser dependencies
        run: |
          command -v google-chrome
          readlink -f "$(command -v google-chrome)"
          google-chrome --version
          test -x /opt/google/chrome/chrome
          npx playwright install-deps chromium
          sudo apt-get install --no-install-recommends -y fonts-noto-cjk fontconfig
      - name: Terminal layout screenshots and bounds
        run: npm run test:layout
      - name: Caps Lock composition transaction browser regression
        run: npm run test:ime
      - name: Monaco lifecycle in Vite dev and production
        run: npx playwright test --config playwright.monaco.config.ts --output=test-results/monaco
      - name: Preserve file editor and image preview evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: file-preview-evidence
          path: test-results/monaco/
          retention-days: 7
          if-no-files-found: warn
      - name: Workspace file preview screenshots and bounds
        run: npm run test:files -- --output=test-results/files
      - name: Agent lifecycle overview browser acceptance
        run: npm run test:agent-status
      - name: Workspace tab mouse drag and persistence
        run: npm run test:tabs
      - name: Agent image drop and paste
        run: npm run test:images

      - name: Agent settings selection and enablement screenshots
        run: node node_modules/@playwright/test/cli.js test --config playwright.agent-settings.config.ts
      - name: Hover, selection, keyboard and touch interaction screenshots
        run: npm run test:interactions
      - name: Conversation preview header layout and keyboard behavior
        run: node node_modules/@playwright/test/cli.js test --config playwright.preview-header.config.ts
      - name: Workspace tab geometry
        run: node node_modules/@playwright/test/cli.js test --config playwright.tab-geometry.config.ts
      - name: Project membership star layout and keyboard behavior
        run: node node_modules/@playwright/test/cli.js test --config playwright.project-membership.config.ts
      - name: Confirmation dialog native Enter behavior
        run: node node_modules/@playwright/test/cli.js test --config playwright.confirmation.config.ts
      - name: Lazy virtual session feed browser acceptance
        run: node node_modules/@playwright/test/cli.js test --config playwright.session-feed.config.ts
      - name: Upload terminal layout evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: terminal-layout-evidence
          path: test-results/
          retention-days: 7
          if-no-files-found: warn
      - name: Synthetic terminal repaint counters
        run: npm run test:flicker
      - name: Upload terminal repaint evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: terminal-repaint-evidence
          path: test-results-flicker/
          retention-days: 7
          if-no-files-found: warn
      - name: Sidebar drag, collapse and reload screenshots
        run: npm run test:sidebar
      - name: Upload sidebar evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: sidebar-evidence
          path: test-results/sidebar/
          retention-days: 7
          if-no-files-found: warn
      - name: Workspace focus-mode browser integration
        run: npm run test:focus-mode
      - name: Upload focus-mode browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: workspace-focus-mode-evidence
          path: test-results/focus-mode/
          retention-days: 7
          if-no-files-found: warn
      - name: Validate visual assets and semantic contrast
        run: python3 scripts/validate-ui-design.py && python3 scripts/validate-macos-icon.py
      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Rust core tests (no desktop)
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --no-default-features
      - name: Rust core lint (no desktop)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --no-default-features --all-targets -- -D warnings
