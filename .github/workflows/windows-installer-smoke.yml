name: Windows installer smoke (manual, x64)
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Full accepted SessionBay commit SHA to build (not a branch or tag)'
        type: string
        required: true
      confirm_disposable_install:
        description: 'Install and uninstall the official product on this disposable hosted runner'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  installer:
    if: inputs.confirm_disposable_install && github.repository == 'wellwind/SessionBay'
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      SESSIONBAY_INSTALLER_SMOKE: '1'
      SESSIONBAY_SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Validate immutable source input
        shell: pwsh
        run: |
          if ($env:SESSIONBAY_SOURCE_SHA -cnotmatch '^[0-9a-f]{40}$') { throw 'Use a full lowercase commit SHA.' }
      - name: Checkout test harness at workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: harness
          persist-credentials: false
      - name: Checkout official source at requested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: wellwind/SessionBay
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Test installer smoke safety gates
        shell: pwsh
        run: ./harness/scripts/test-windows-installer-guards.ps1
      - name: Build, install, launch and uninstall
        shell: pwsh
        run: ./harness/scripts/ci-windows-installer-smoke.ps1 -AcceptDisposableRunner
      - name: Preserve acceptance evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer-smoke-x64-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/windows-installer/
            source/artifacts/windows-smoke/
            source/src-tauri/target/release/nsis/
            source/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 7
          if-no-files-found: warn
