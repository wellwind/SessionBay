name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not paste real conversations, tokens or private paths. Redact them first.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Session Bay version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and version
      placeholder: macOS 15.5 (Apple Silicon)
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent and version (if relevant)
      placeholder: Claude Code 2.x
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
